# Runs the browser tests (apps/web/e2e) against each Vercel dashboard deployment once it is live.
#
# Vercel tells GitHub about finished deployments with a `repository_dispatch` event
# (`vercel.deployment.success`). GitHub only runs this workflow for that event from `main`,
# so changes here take effect on the deployments that follow the merge.
# Because those runs belong to `main`, the result is also posted as a commit status
# ("E2E (deployed dashboard)") on the deployed commit, so it shows up on the pull request.
#
# `workflow_dispatch` lets the Owner re-run the tests against any address from the Actions tab.
name: E2E

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      url:
        description: Dashboard address to test (e.g. https://tidewatch-ten.vercel.app)
        required: true

permissions:
  contents: read
  statuses: write

env:
  STATUS_CONTEXT: E2E (deployed dashboard)

jobs:
  e2e:
    name: E2E (deployed dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      TARGET_URL: ${{ github.event.client_payload.url || inputs.url }}
      TARGET_SHA: ${{ github.event.client_payload.git.sha || github.sha }}
      # Optional. Only needed if Vercel Deployment Protection is switched on for previews.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Signs in the dedicated Clerk test user (Clerk development instance only).
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Work out target address
        run: |
          url="${TARGET_URL}"
          case "$url" in
            http://*|https://*) ;;
            *) url="https://${url}" ;;
          esac
          echo "E2E_BASE_URL=${url%/}" >> "$GITHUB_ENV"

      - name: Mark check as running on the deployed commit
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending -f context="${STATUS_CONTEXT}" \
            -f description="Testing ${E2E_BASE_URL}" -f target_url="${RUN_URL}" > /dev/null

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm e2e

      - name: Report result on the deployed commit
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "${JOB_STATUS}" = "success" ]; then state=success; desc="Passed on ${E2E_BASE_URL}"; else state=failure; desc="Failed on ${E2E_BASE_URL}"; fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" -f context="${STATUS_CONTEXT}" \
            -f description="${desc:0:139}" -f target_url="${RUN_URL}" > /dev/null

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
