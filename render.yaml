# Render Blueprint for Tidewatch (ARCHITECTURE.md AD2, Section 7).
#
# Staging only for now: deploys automatically after a merge to main, once CI checks pass.
# Production (manual deploy only, its own database) is added back in milestone M4, when
# there is something to launch. Until then it would cost ~$33/month doing nothing.
#
# Secrets use `sync: false`: Render asks for their values when the Blueprint is first
# created. Values never live in this file (CLAUDE.md §7).
# Plan IDs follow Render's Blueprint spec (Oct 2026); region is Frankfurt (closest to the Owner).

projects:
  - name: tidewatch
    environments:
      # ------------------------------------------------------------------ staging
      - name: staging
        services:
          - type: web
            name: tidewatch-api-staging
            runtime: python
            region: frankfurt
            plan: 0.5c-512mb
            rootDir: backend
            branch: main
            autoDeployTrigger: checksPass
            buildCommand: pip install uv && uv sync --locked --no-dev
            # Applies database migrations before each new API version goes live. If a migration
            # fails, the deploy stops and the previous version keeps running.
            preDeployCommand: .venv/bin/alembic upgrade head
            startCommand: .venv/bin/uvicorn tidewatch.api.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /health
            envVars:
              - key: PYTHON_VERSION
                value: 3.13.5
              - key: APP_ENV
                value: staging
              - key: DATABASE_URL
                fromDatabase:
                  name: tidewatch-db-staging
                  property: connectionString
              - key: CORS_ALLOWED_ORIGINS   # the staging dashboard's Vercel address
                sync: false
              - key: CORS_ALLOWED_ORIGIN_REGEX   # pattern matching this project's Vercel preview links
                sync: false
              - key: CLERK_SECRET_KEY   # verifies sign-in on every API route except /health
                sync: false
              - key: SURPLUS_API_KEY   # worker/reviewer AI tiers (ARCHITECTURE.md AD9)
                sync: false
              - key: ANTHROPIC_API_KEY   # professor tiers and fallback (official API only)
                sync: false

          - type: worker
            name: tidewatch-worker-staging
            runtime: python
            region: frankfurt
            plan: 0.5c-512mb
            rootDir: backend
            branch: main
            autoDeployTrigger: checksPass
            buildCommand: pip install uv && uv sync --locked --no-dev
            startCommand: .venv/bin/python -m tidewatch.worker
            envVars:
              - key: PYTHON_VERSION
                value: 3.13.5
              - key: APP_ENV
                value: staging
              - key: SURPLUS_API_KEY
                sync: false
              - key: ANTHROPIC_API_KEY
                sync: false
              - key: DATABASE_URL
                fromDatabase:
                  name: tidewatch-db-staging
                  property: connectionString

        databases:
          - name: tidewatch-db-staging
            plan: 0.1c-256mb
            region: frankfurt
            postgresMajorVersion: '17'
            databaseName: tidewatch
            user: tidewatch
