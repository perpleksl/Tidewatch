# Render Blueprint for Tidewatch (ARCHITECTURE.md AD2, Section 7).
#
# Two environments in one project:
#   staging     deploys automatically after a merge to main, once CI checks pass.
#   production  never deploys by itself; the Owner triggers it manually in Render
#               ("Manual Deploy" on each production service) to promote a version.
#
# Secrets use `sync: false`: Render asks for their values when the Blueprint is first
# created. Values never live in this file (CLAUDE.md §7).
# Plan IDs follow Render's Blueprint spec (Oct 2026); region is Frankfurt (closest to the Owner).

projects:
  - name: tidewatch
    environments:
      # ------------------------------------------------------------------ staging
      - name: staging
        services:
          - type: web
            name: tidewatch-api-staging
            runtime: python
            region: frankfurt
            plan: 0.5c-512mb
            rootDir: backend
            branch: main
            autoDeployTrigger: checksPass
            buildCommand: pip install uv && uv sync --locked --no-dev
            startCommand: .venv/bin/uvicorn tidewatch.api.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /health
            envVars:
              - key: PYTHON_VERSION
                value: 3.13.5
              - key: APP_ENV
                value: staging
              - key: DATABASE_URL
                fromDatabase:
                  name: tidewatch-db-staging
                  property: connectionString
              - key: CORS_ALLOWED_ORIGINS   # the staging dashboard's Vercel address
                sync: false
              - key: CORS_ALLOWED_ORIGIN_REGEX   # pattern matching this project's Vercel preview links
                sync: false

          - type: worker
            name: tidewatch-worker-staging
            runtime: python
            region: frankfurt
            plan: 0.5c-512mb
            rootDir: backend
            branch: main
            autoDeployTrigger: checksPass
            buildCommand: pip install uv && uv sync --locked --no-dev
            startCommand: .venv/bin/python -m tidewatch.worker
            envVars:
              - key: PYTHON_VERSION
                value: 3.13.5
              - key: APP_ENV
                value: staging
              - key: DATABASE_URL
                fromDatabase:
                  name: tidewatch-db-staging
                  property: connectionString

        databases:
          - name: tidewatch-db-staging
            plan: 0.1c-256mb
            region: frankfurt
            postgresMajorVersion: '17'
            databaseName: tidewatch
            user: tidewatch

      # --------------------------------------------------------------- production
      - name: production
        services:
          - type: web
            name: tidewatch-api-production
            runtime: python
            region: frankfurt
            plan: 0.5c-512mb
            rootDir: backend
            branch: main
            autoDeployTrigger: "off"
            buildCommand: pip install uv && uv sync --locked --no-dev
            startCommand: .venv/bin/uvicorn tidewatch.api.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /health
            envVars:
              - key: PYTHON_VERSION
                value: 3.13.5
              - key: APP_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: tidewatch-db-production
                  property: connectionString
              - key: CORS_ALLOWED_ORIGINS   # the production dashboard's address (set in M4)
                sync: false

          - type: worker
            name: tidewatch-worker-production
            runtime: python
            region: frankfurt
            plan: 0.5c-512mb
            rootDir: backend
            branch: main
            autoDeployTrigger: "off"
            buildCommand: pip install uv && uv sync --locked --no-dev
            startCommand: .venv/bin/python -m tidewatch.worker
            envVars:
              - key: PYTHON_VERSION
                value: 3.13.5
              - key: APP_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: tidewatch-db-production
                  property: connectionString

        databases:
          - name: tidewatch-db-production
            plan: 0.5c-1g
            region: frankfurt
            postgresMajorVersion: '17'
            databaseName: tidewatch
            user: tidewatch
