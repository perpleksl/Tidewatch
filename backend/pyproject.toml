[project]
name = "tidewatch"
version = "0.1.0"
description = "Tidewatch backend: data ingestion, scoring, lifecycle, digest and API."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "clerk-backend-api>=7.0",
    "fastapi>=0.115",
    # ASGI server that runs the FastAPI app (locally and on Render).
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    # Required by FastAPI's TestClient for API tests.
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tidewatch"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # naming
    "S",   # security (bandit)
    "DTZ", # timezone-aware datetimes (all times are UTC)
    "SIM", # simplifications
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tidewatch", "tests"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["tidewatch"]
branch = true
